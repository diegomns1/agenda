# Vaguinha (painel + site). Criado pelo Claude; não mexe nos outros sites.
# O certbot acrescenta o HTTPS depois que o DNS apontar para esta VPS.

# painel.vaguinha.app e www.vaguinha.app: o próprio app decide o que mostrar pelo endereço (src/proxy.ts)
server {
    listen 80;
    listen [::]:80;
    server_name painel.vaguinha.app www.vaguinha.app;
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}

# vaguinha.app (sem www) → www.vaguinha.app (como a Vercel fazia)
server {
    listen 80;
    listen [::]:80;
    server_name vaguinha.app;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://www.vaguinha.app$request_uri; }
}
