<!-- Subject: Seu código de confirmação do Vaguinha -->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#FCF6F1;padding:28px 12px;font-family:Nunito,Segoe UI,Arial,sans-serif">
  <tr><td align="center">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:20px">
      <tr><td style="padding:26px 28px 8px">
        <p style="margin:0 0 14px;font-size:20px;font-weight:800;color:#702D50">Vaguinha</p>
        <h1 style="margin:0 0 14px;font-size:22px;color:#702D50">Código de confirmação</h1>
        <p style="margin:0 0 14px;font-size:16px;line-height:1.55;color:#1F1F23">Use o código abaixo para confirmar a ação no Vaguinha:</p>
        <p style="margin:18px 0;font-size:32px;font-weight:800;letter-spacing:6px;color:#702D50">{{ .Token }}</p>
        <p style="margin:0 0 14px;font-size:13px;line-height:1.5;color:#6b6b73">Se você não pediu este código, ignore este e-mail.</p>
      </td></tr>
      <tr><td style="padding:16px 28px 24px;font-size:12px;color:#8a8a92;border-top:1px solid #f0e6ea">Vaguinha · agenda para profissionais autônomas · <a href="{{ .SiteURL }}" style="color:#8a8a92">{{ .SiteURL }}</a></td></tr>
    </table>
  </td></tr>
</table>
